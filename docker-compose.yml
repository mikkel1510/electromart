services:
  react-app:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - load-balancer

  backend-1:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "3001"

  backend-2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "3001"

  load-balancer:
    image: nginx:alpine
    ports:
      - "3001:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-1
      - backend-2
